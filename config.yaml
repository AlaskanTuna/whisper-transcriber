# Whisper Transcriber Configuration
# Edit these values or change them interactively via Settings.

model_size: small
language: auto
task: transcribe

# Output. 'md' is the LLM-structured document; txt/srt/vtt/json are mechanical.
output_format: txt
polish: false
polish_profile: meeting

# Audio extracted from video is cached in audio/ so a re-run skips ffmpeg.
# Whisper resamples to 16 kHz mono regardless; this only affects the kept copy.
audio_bitrate: 192k
keep_extracted_audio: true

summary_style: concise
gemini_model: gemini-3.5-flash-lite

languages:
  - English
  - Japanese
  - Chinese
  - Korean
  - Spanish
  - French
  - German
  - Portuguese
  - Italian
  - Dutch
  - Russian
  - Arabic
  - Hindi
  - Turkish
  - Vietnamese
  - Thai
  - Indonesian

file_extensions:
  - .m4a
  - .mp3
  - .wav
  - .flac
  - .ogg
  - .aac
  - .opus
  - .webm

video_extensions:
  - .mp4
  - .mkv
  - .mov
  - .avi
  - .m4v
  - .flv
  - .wmv
  - .ts
  - .mpg
  - .mpeg
