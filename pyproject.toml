[project]
name = "whisper-transcriber"
version = "4.0.0"
description = "Local audio transcription using OpenAI Whisper"
requires-python = ">=3.10, <3.14"
dependencies = [
    "openai-whisper",
    "torch==2.7.1",
    "ffmpeg-python==0.2.0",
    "rich",
    "questionary",
    "google-genai",
    "pyyaml",
]

[project.scripts]
transcriber = "src.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
